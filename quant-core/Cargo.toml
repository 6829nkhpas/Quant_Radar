[package]
name = "quant-core"
version = "0.1.0"
edition = "2021"
description = "Tauri-free shared quant engine (indicators, patterns, consensus, validators) used by the Strat Ai desktop app and the standalone tool-server."

[lib]
name = "quant_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"

[dev-dependencies]
proptest = "1"
