name: ci-deploy

# Every push to main: test, then build and push the image to GHCR, then (only once
# the box exists) pull and restart it there.
#
# The image job needs nothing beyond the built-in GITHUB_TOKEN (packages: write).
# quant-core is vendored in the repo, so no other repo is read.
#
# The deploy job runs only while the repo variable DEPLOY_HOST is set (dev-vm since
# 2026-10-30). Settings → Secrets and variables → Actions:
#   Secret    DEPLOY_SSH_KEY      private key of `radar-deploy` on dev-vm
#   Variables DEPLOY_HOST         dev-vm's IP
#             DEPLOY_USER         SSH user (default: radar-deploy)
#             DEPLOY_FINGERPRINT  the VM's SSH host key, `SHA256:…`, so a changed
#                                 host is refused instead of trusted
# That key can run nothing but /opt/quant-radar/update.sh (deploy/update.sh): the
# VM forces the command, so the `script` below is only a label. Setup: README.md
# "One-time VM setup".

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/6829nkhpas/quant_radar

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER || 'radar-deploy' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ vars.DEPLOY_FINGERPRINT }}
          script: update
