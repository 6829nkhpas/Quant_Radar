# Quant_Radar on dev-vm (GCP asia-south1-a, the strat-sentiment research VM), as its
# own compose project in /opt/quant-radar.
#
# It listens on the VM's loopback only. The host's nginx is the only way in: its
# `sentiment-api.stratai.live` server proxies `location = /ws/radar` here, and
# Cloudflare (the only source the firewall admits on 443) serves it to browsers at
# wss://sentiment-api.stratai.live/ws/radar. The research API shares the VM and the
# nginx, not this compose project.
#
# No healthcheck: the distroless image has no shell or curl to run one. Probe
# `curl -s http://127.0.0.1:8090/health` on the VM instead (it answers 503 when the
# board is more than 180 s old).

name: quant-radar

services:
  quant-radar:
    image: ghcr.io/6829nkhpas/quant_radar:${TAG:-latest}
    container_name: quant-radar
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    ports: ["127.0.0.1:8090:8090"]
    # Measured 2026-10-30 (cgroup anon memory): ~29 MiB idle, +13 MiB with 1,000
    # clients after a broadcast, 51 MiB peak, back to ~30 MiB once they left. Before
    # main.rs capped the read buffer at 4 KiB (tungstenite's default is 128 KiB per
    # socket), the same 1,000 clients took ~122 MiB and filled the old 128m. 256m
    # leaves wide room for RADAR_MAX_CLIENTS (2000).
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
